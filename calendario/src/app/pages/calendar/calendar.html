
<main class="calendar-container">

  <header class="calendar-header">

    <a routerLink="/inicio" class="back-button">
      ← Tornar a l'inici
    </a>

    <span class="subtitle">BON NADAL</span>

    <h1>El teu calendari d'Advent</h1>

    <div class="progress">
      {{ availableGifts }} de 24 regals disponibles
    </div>

  </header>

  <section class="mosaic-wrapper">

    <div class="calendar-mosaic">

      @for (gift of gifts; track gift.day) {

        <button
          class="gift-card"
          [style.grid-area]="'d' + gift.day"
          [class.unlocked]="isAvailable(gift.day)"
          [class.locked]="!isAvailable(gift.day)"
          [class.final-gift]="gift.day === 24"
          [class.image-card]="!!calendarImages[gift.day]"
          [style.background-image]="getCalendarBackground(gift.day)"
          [disabled]="!isAvailable(gift.day)"
          (click)="openGift(gift.day)"
          [attr.aria-label]="'Regal del dia ' + gift.day"
        >

          <span class="day-number">
            {{ gift.day.toString().padStart(2, '0') }}
          </span>

          <span class="card-status">
            @if (isAvailable(gift.day)) {
              Obre'm
            } @else {
              Properament
            }
          </span>

        </button>

      }

    </div>

  </section>

  <footer class="calendar-footer">
    <span>✦</span>
    Una sorpresa diferent cada dia
    <span>✦</span>
  </footer>

</main>
