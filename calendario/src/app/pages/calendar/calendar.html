
<main class="calendar-container">

  <header class="calendar-header">

    <a routerLink="/inicio" class="back-button">
      <span>←</span> Tornar a l'inici
    </a>

    <span class="subtitle">✦ CHRISTMAS COLLECTION ✦</span>

    <h1>El teu calendari d'Advent</h1>

    <p>
      24 sorpreses, 24 moments especials.
      Cada dia amaga una nova il·lusió.
    </p>

    <div class="progress">
      <span class="progress-icon">✧</span>
      {{ availableGifts }} de 24 regals disponibles
    </div>

  </header>

  <section class="mosaic-wrapper">

    <div class="calendar-mosaic">

      @for (gift of gifts; track gift.day) {

        <button
          class="gift-card"
          [style.grid-area]="'d' + gift.day"
          [class.unlocked]="isAvailable(gift.day)"
          [class.locked]="!isAvailable(gift.day)"
          [class.final-gift]="gift.day === 24"
          [disabled]="!isAvailable(gift.day)"
          (click)="openGift(gift.day)"
          [attr.aria-label]="'Regal del dia ' + gift.day"
        >

          <span class="day-number">
            {{ gift.day.toString().padStart(2, '0') }}
          </span>

          @if (isAvailable(gift.day)) {
            <span class="gift-icon">🎁</span>
            <span class="card-status">Obre'm</span>
          } @else {
            <span class="gift-decoration">
              @switch (gift.day % 5) {
                @case (0) { ✦ }
                @case (1) { ❄ }
                @case (2) { ✧ }
                @case (3) { 🎀 }
                @case (4) { ❋ }
              }
            </span>
            <span class="card-status">Properament</span>
          }

        </button>

      }

      <!-- ESPAI DECORATIU CENTRAL -->

      <div class="mosaic-centerpiece">

        <span class="center-ornament">✦</span>

        <span class="center-title">Bon Nadal</span>

        <span class="center-subtitle">
          UNA MICA DE MÀGIA
        </span>

        <span class="center-ornament">✧</span>

      </div>

    </div>

  </section>

  <footer class="calendar-footer">
    <span>✦</span>
    Una sorpresa diferent cada dia
    <span>✦</span>
  </footer>

</main>
